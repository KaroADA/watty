[package]
name = "watty"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
btleplug = "0.13.5"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
ratatui = "0.30.2"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.28.0"
